<!DOCTYPE html>
<html lang="en">
<head>

    <!-- ________________________________________________________ -->

    <!-- DIDNT USED AI!-->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- NO AI IS USED -->

    <style>
        /* DIDNT USED AI (NOT EVEN FOR THE GRADIENT LEOVEN CAN EXPLAIN)*/
        html, body {
            margin: 0;
            height: 100%;
        }
        body {
            min-height: 100%;
            background: linear-gradient(to bottom, #3f5382, #161b32);
        }

        .GameFront {
            min-height: 85vh;
            display: flex;
            justify-content: flex-start;
            align-content: center;
            position: relative;      /* anchor for sun/clouds/ocean */
            overflow: hidden;        /* clips clouds at the edges */
            /* the sky */
            background: linear-gradient(to bottom, #6cb8f0 0%, #a5d8f7 45%, #d9f1fc 60%);
        }


        .Ocean {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 55%;            
            background: linear-gradient(to bottom, #2e86d9 0%, #1a5aa8 50%, #0e2f63 100%);
            pointer-events: none;    
        }
    
        .Sun {
            position: absolute;
            top: 6%;
            right: 8%;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #f8e133);
            pointer-events: none;
        }

        .Cloud {
            position: absolute;
            width: 130px;
            height: 40px;
            background: #fff;
            border-radius: 40px;
            opacity: 0.9;
            animation: Drift 50s linear infinite; /*Explanation: animation for the cloud to slide*/
            pointer-events: none;
        }
        .Cloud::before {        /*Explanation: ::before ::after is to add elements and it behaves like Cloud. What changes is size between balls and thats what makes clouds look cloudy*/       
            content: "";
            position: absolute;
            width: 55px; height: 55px;
            border-radius: 50%;
            background: #fff;
            top: -26px; left: 18px;
        }
        .Cloud::after {         
            content: "";
            position: absolute;
            width: 38px; height: 38px;
            border-radius: 50%;
            background: #fff;
            top: -16px; right: 20px;
        }
        .c1 { top: 8%;  animation-delay: -10s; }
        .c2 { top: 20%; transform: scale(0.7);  animation-delay: -30s; animation-duration: 65s; } /*The time it takes for clouds to go*/
        .c3 { top: 4%;  transform: scale(1.25); animation-delay: -45s; animation-duration: 75s; }
        @keyframes Drift {
            from { left: -180px; }
            to   { left: 100%; }
        }

        .Showcase {
            width: 300px;
            min-height: 400px;
            padding: 24px;
            background: #1e2544;
            border: 2px solid #4a5b8c;
            border-radius: 16px;
            text-align: center;
            align-self: center;
            color: white;
            font-family: sans-serif;
        }
        
        .BaseFihPic {
            max-height: 250px;
            max-width: 300px
        }

        .col1 {
            min-height: 85vh;
            min-width: 85vh;
            align-items: center;
            display: flex;
            justify-content: center;
            position: relative;      
        }

        .col2 {
            display: flex;
            flex-grow: 1;
            min-height: 85vh;
            min-width: 300px;
            position: relative;
        }

        .Txt{
            display: flex;
            font-size: 60px;
            align-items: center;
            justify-content: center;
        }

        .StartBtn {
            width: 150px;
            height: 50px;
        }

        .PopBtn {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .PopBg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0;
        }

        /* NO AI IS USED FOR THIS CODE*/

    </style>
</head>
<body>
    <!-- NO AI -->
    <div class="GameFront">
        <div class="Ocean">
        </div>
        <div class="Sun"></div>
        <div class="Cloud c1"></div>
        <div class="Cloud c2"></div>
        <div class="Cloud c3"></div>

        <div class="col1">
            <div class="Showcase">
                <img src="Basic_Fih.png" alt="Fih" class="BaseFihPic">
                <h2 class="BaseFihName">Start Fishing</h2>
                <p class="BaseFihDesc">The view is good today</p>
                <button onclick="StartGame()" class="StartBtn">HOOK</button>
            </div>
        </div>
        <div class="col2">
            <h1 class="Txt"></h1>
        </div>
    </div>
    <!-- PETITIONS AGAINST AI! -->


     <script> //Script -------------------------------------------------------------------------------

        const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms)); //to make waiting code

        let Score = 0;
        let Mistake = 0;
        let GameRunning = false;
        let WillReset = false;
        let SpawnTimer = null;
        let col2 = document.querySelector(".col2");
        let BtnText = document.querySelector(".Showcase button");

        let CommonFish = [
                { name: "Common Minnow", desc: "Just a basic little fish from the shallow waters. Fih.", image: "Basic_Fih.png" },
            { name: "Boot", desc: "Not even a fish bro.", image: "boot.png" },
            { name: "Silver Herring (Yellow)", desc: "A shiny little fish that swims in big schools.", image: "Yellow_Fih.png" },
            { name: "Muddy Catfish", desc: "Lives near the bottom. Atleast it looks like some zebras.", image: "Zebra_Fih.png" }
        ];
            let UncommonFish = [
            { name: "Emerald Trout", desc: "A nice green trout with bright shiny scales!", image: "Emerald_Fih.png" },
            { name: "Amber Perch", desc: "Glimmers like gold in the afternoon sun.", image: "Flaming_Fih.png" },
            { name: "Koi Fish", desc: "Its patterns can be very amazing to look at.", image: "koi.png" }
        ];

            let RareFish = [
                { name: "Sapphire Shark", desc: "A powerful blue shark from deep ocean trenches.", image: "Diamond_Fih.png" }
        ];

            let EpicFish = [
                { name: "Atlantis Sturgeon", desc: "Its eggs are caviars! (Dont mind the bluish skin)", image: "Cold_Fih.png" }
        ];

            let LegendaryFish = [
                { name: "Evil Leviathan", desc: "I think you're its prey if you're not careful", image: "Evil_Fih.png" },
                { name: "The Fih", desc: "Square. Unknown. Never been disccovered before", image: "Geometric_Fih.png" }
        ];
        
        
        function StartGame() {
            TextPop("");
            BtnText.innerText = "STOP";
            let rarity = CalLuck();
            UpdState();       
            RunGame();
            
        }

        function RunGame(){
            let GameMode=GameSelect();
            if (GameRunning){
                SpawnTimer = setInterval(function() {
                    RunTurn(GameMode);
                        }, Math.random()*(1200-1000+1)+1000); 
                    } else {
                        clearInterval(SpawnTimer); 
                        TextPop("Never Give up!");

                    }
        }
        
        function GameSelect(){
            /*let Games = ["Buttons","Timing","Spam"]
            let Gamemode = Math.floor(Math.floor(Math.random()*3));
            let Selected= Games[Gamemode]
            return Selected;*/
            return "Buttons"
        }

        function SelectButtons(){
            if (GameRunning){
                SpawnTimer = setInterval(function() {
                    RunButtons();
                        }, Math.random()*(1200-1000+1)+1000); 
                    } else {
                        clearInterval(SpawnTimer); 
                        TextPop("Never Give up!");
                    }
                }


        function RunButtons(){
            
            if (WillReset){
                let Module = {btn:".PopBtn",bg: ".PopBg"}
                ResetGame(Module);
                WillReset=false;
                return;
            }
            
            let btn = document.createElement("button");
            let bg = document.createElement("button");

            btn.className = "PopBtn";
            bg.className = "PopBg";
            col2.appendChild(bg);

            let X = col2.clientWidth - 50;
            let Y = col2.clientHeight - 50;
            let waterTop = Y * 0.45;   /* keep fish below the horizon line */
            let ranX = Math.floor(Math.random() * X);
            let ranY = Math.floor(waterTop + Math.random() * (Y - waterTop));

            btn.style.left = ranX + "px";
            btn.style.top = ranY + "px";

            btn.onclick = function() {
                Score = Score + 1;
                MistakeTell(btn,"green");
            };

            bg.onclick = function(){
                console.log("OOPS")
                Mistake = Mistake + 1;
                MistakeTell(bg,"red")
            }

            col2.appendChild(btn);

            setTimeout(function() {
                if (btn.parentElement) { 
                    console.log("OOPS")
                    Mistake = Mistake+1;
                    MistakeTell(btn,"red");
                }
            }, 1200);
        
        }

        async function MistakeTell(obj,color){
            
            obj.style.backgroundColor=color;
            await delay(100);
            obj.remove();
        }

        /*function RunTiming(){
            console.log("Time");
        }

        function RunSpam(){
            console.log("Spam");
        }*/

        function ResetGame(...Stuff){
            clearInterval(SpawnTimer);
            Mistake = 0;
            Score = 0;

            Stuff.forEach(function (module) {
                Object.values(module).forEach(function (key) {
                    let val = col2.querySelectorAll(key);
                    val.forEach(function (el) {
                        el.remove();
                });
            }) 
        })}

        function TextPop(Txt){
            let PopText=document.querySelector(".Txt");
            PopText.innerText=Txt;    
        }

        function RunTurn(Mode){
            if (Mistake>=6){
                UpdState();
                TextPop("Be faster and more accurate!");
                WillReset=true;
                
                
            }
            else if (Score>=20){
                UpdState();
                WillReset=true;
                GetFish();
            }

            if (Mode=="Buttons"){
                RunButtons();
            }

            /*if (Mode=="Timing"){
                RunTiming();
            }

            if (Mode=="Spam"){
                RunSpam();
            }*/
        }
        
        function GetFish(){
            Catch(CalLuck());

        }
        

        function Catch(Rarity){
            let lst={"common": CommonFish, "uncommon": UncommonFish, "rare": RareFish, 
                "epic": EpicFish, "legendary": LegendaryFish};

            let type=lst[Rarity];
            let Fih = type[Math.floor(Math.random()*type.length)];

            ShowFish(Fih, Rarity);
             
        }
        
        

        function CalLuck(){
            let random = Math.random() * 100;

            if (random < 50) {
                return "common";
            } else if (random < 80) {
                return "uncommon";
            } else if (random < 93) {
                return "rare";
            } else if (random < 99) {
                return "epic";
            } else {
                return "legendary";
            }
        }

        function ShowFish(Fih, Type){

            let colLst={"common":"rgb(146, 145, 145)","uncommon":"rgb(37, 141, 55)",
                        "rare":"rgb(44, 53, 167)","epic":"rgb(93, 14, 109)","legendary":"rgb(167, 114, 16)"};
            
            let Name=document.querySelector(".BaseFihName");
            let Desc = document.querySelector(".BaseFihDesc");
            let Img = document.querySelector(".BaseFihPic");

            Name.innerText = Fih.name;
            Desc.innerText = Fih.desc;
            Img.setAttribute("src", Fih.image);

            Name.style.color= colLst[Type];
  
        }

        function UpdState() {
            if (GameRunning){
                GameRunning=false;
                BtnText.innerText = "HOOK";
                return;
            }
            GameRunning=true;
        }

        
        //NOT AI CODEEEEEEEEEEEE
        //MADE BY HAND




     </script>
</body>
</html>
